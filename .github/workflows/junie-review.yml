name: Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    environment: junie-review
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.JUNIE_APP_ID }}
          private-key: ${{ secrets.JUNIE_APP_PRIVATE_KEY }}

      - uses: JetBrains/junie-github-action@fadeeva/summary-parameter
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          junie_version: "latest"
          use_single_comment: "true"
          prompt: "code-review"
          skip_review_summary: "true"
          custom_github_token: ${{ steps.app-token.outputs.token }}
