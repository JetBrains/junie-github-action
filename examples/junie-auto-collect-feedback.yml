# Auto-collect code-review feedback on PR close (EAP / JUNP only).
# Use alongside a code-review workflow without auto_collect_feedback.
name: Junie Auto-collect Feedback

on:
  pull_request:
    types: [closed]

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # SHA survives auto-delete of the head branch
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: JetBrains/junie-github-action@v1
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          auto_collect_feedback: "true"
